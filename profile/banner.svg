<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151C3D"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6366F1" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow1" cx=".85" cy=".2" r=".6">
      <stop offset="0" stop-color="#06B6D4" stop-opacity=".30"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".1" cy=".9" r=".6">
      <stop offset="0" stop-color="#6366F1" stop-opacity=".30"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <style>
      .pulse{animation:p 3s ease-in-out infinite}
      .d2{animation-delay:1s}.d3{animation-delay:2s}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow2)"/>

  <!-- circuit lines right -->
  <g stroke="url(#ac)" stroke-width="2" fill="none" opacity=".55">
    <path d="M820 60 H920 V120 H1040 V80 H1140"/>
    <path d="M780 180 H900 V240 H1010 V200 H1150"/>
    <path d="M880 290 H960 V260"/>
  </g>
  <g fill="#06B6D4">
    <circle class="pulse" cx="1140" cy="80" r="6"/>
    <circle class="pulse d2" cx="1150" cy="200" r="6"/>
    <circle class="pulse d3" cx="960" cy="260" r="6"/>
    <circle cx="920" cy="60" r="4" opacity=".7"/>
    <circle cx="1040" cy="120" r="4" opacity=".7"/>
    <circle cx="900" cy="240" r="4" opacity=".7"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(70 70) scale(.33)">
    <rect width="512" height="512" rx="112" fill="#0B1020" stroke="url(#ac)" stroke-width="10"/>
    <path d="M164 128 H236 V300 H352 V368 H164 Z" fill="url(#ac)"/>
    <rect x="288" y="128" width="76" height="76" rx="20" fill="#fff"/>
  </g>

  <!-- wordmark -->
  <text x="270" y="160" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="4">LOXORA</text>
  <text x="274" y="205" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="url(#ac)" letter-spacing="15">SYSTEMS</text>
  <rect x="274" y="228" width="56" height="4" rx="2" fill="url(#ac)"/>
  <text x="274" y="270" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#A5B4FC">Software that runs your business.</text>
</svg>
