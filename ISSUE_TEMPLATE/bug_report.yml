name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low (cosmetic)
        - Medium (feature impaired)
        - High (feature broken)
        - Critical (system down / data at risk)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or environment
